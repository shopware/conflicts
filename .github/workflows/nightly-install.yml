name: Nightly Install

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/nightly-install.yml
      - .github/supported-shopware-version.js

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Matrix
        id: generate-matrix
        run: |
          MATRIX=$(node .github/supported-shopware-version.js)
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$MATRIX" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  install:
    name: install (${{ matrix.version }} / ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    needs: generate-matrix
    strategy: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Database
        run: echo "Using ${{ matrix.mysql }} for ${{ matrix.version }}"

      - name: Setup Shopware
        uses: shopware/setup-shopware@v2
        with:
          env: prod
          shopware-version: ${{ matrix.version }}
          php-version: 8.2
          install: true
          allow-insecure-versions: true
          mysql-version: ${{ matrix.mysql }}

      - name: Install DemoData
        run: |
          bin/console store:download -p SwagPlatformDemoData
          bin/console plugin:refresh
          bin/console plugin:install --activate SwagPlatformDemoData

